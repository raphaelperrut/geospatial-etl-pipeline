services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geospatial-etl-postgis
    environment:
      POSTGRES_DB: geospatial_etl
      POSTGRES_USER: geospatial_etl
      POSTGRES_PASSWORD: geospatial_etl
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U geospatial_etl -d geospatial_etl"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: